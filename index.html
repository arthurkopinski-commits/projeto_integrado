<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Faunadex Arena</title>
    <style>
        body {
            background-color: #1a1a2e; /* Fundo noturno */
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Tela inteira */
            margin: 0;
        }
        
        /* A CAIXA PAI (Onde tudo acontece) */
        .arena { 
            background-color: #16213e; 
            padding: 30px; 
            border-radius: 15px;
            display: grid;
            /* 3 colunas: esquerda (aliado), centro (tabuleiro), direita (inimigo) */
            grid-template-columns: 150px 450px 150px;
            gap: 40px; /* Corredor separando as colunas */
            height: 80vh;
        }        

        /* Transformando a Mão em um Grid de 5 linhas */
        .mao-aliado, .mao-inimigo {
            display: grid;
            grid-template-rows: repeat(5, 1fr); /* 5 linhas dividindo a altura por igual */
            gap: 15px;
        }

        /* Desenhando a Carta */
        .carta {
            background-size: cover; /* Faz a foto preencher a carta toda */
            background-position: center;
            border: 2px solid #4CAF50; /* Borda Verde */
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: transparent; /* Esconde o texto provisório */
            cursor: pointer;
            transition: transform 0.2s; /* Animação suave */
        }
        
        /* Efeito de Hover (passar o mouse) */
        .carta:hover {
            transform: scale(1.1); /* A carta cresce um pouquinho! */
            border-color: yellow;
        }

        /* Cartas do Inimigo ficam vermelhas */
        .inimigo {
            border-color: #e94560;
        }

        /* Estrutura do Tabuleiro */
        .tabuleiro {
            display: grid;
            /* 3 colunas iguais, 3 linhas fluidas iguais */
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            background-color: #0d1b2a;
            border: 3px solid #e94560;
            border-radius: 10px;
            padding: 15px;
        }

        .slot {
            background-color: #1b263b;
            border: 1px solid #415a77;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        /* Efeito ao passar o mouse nos slots */
        .slot:hover {
            background-color: #4CAF50;
            cursor: pointer;
        }       
    </style>
</head>
<body>

    <div class="arena">
        
        <!-- Mão do Aliado (Preenchida via JavaScript) -->
        <div class="mao-aliado"></div>

        <!-- Mesa Central -->
        <div class="tabuleiro">
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
            <div class="slot">Mesa</div>
        </div>

        <!-- Mão do Inimigo (Preenchida via JavaScript) -->
        <div class="mao-inimigo"></div>

    </div>

    <!-- CÉREBRO DO JOGO -->
    <script>
        // Banco de Dados de Animais Aliados (Imagens reais atualizadas)
        const bancoDeCartasAliadas = [
            { id: 1, nome: "Urso Alpha", forca: 8, img: "https://unsplash.com" },
            { id: 2, nome: "Urso Beta", forca: 9, img: "https://unsplash.com" },
            { id: 3, nome: "Urso Charlie", forca: 5, img: "https://unsplash.com" },
            { id: 4, nome: "Urso Delta", forca: 6, img: "https://unsplash.com" },
            { id: 5, nome: "Urso Echo", forca: 7, img: "https://unsplash.com" }
        ];

        // Banco de Dados de Animais Inimigos
        const bancoDeCartasInimigas = [
            { id: 6, nome: "Urso Rival 1", forca: 6, img: "https://unsplash.com" },
            { id: 7, nome: "Urso Rival 2", forca: 7, img: "https://unsplash.com" },
            { id: 8, nome: "Urso Rival 3", forca: 8, img: "https://unsplash.com" },
            { id: 9, nome: "Urso Rival 4", forca: 5, img: "https://unsplash.com" },
            { id: 10, nome: "Urso Rival 5", forca: 9, img: "https://unsplash.com" }
        ];

        const maoAliado = document.querySelector('.mao-aliado');
        const maoInimigo = document.querySelector('.mao-inimigo');

        // Renderizar cartas aliadas
        bancoDeCartasAliadas.forEach(cartaDado => {
            let cartaElemento = document.createElement('div');
            cartaElemento.classList.add('carta');
            cartaElemento.style.backgroundImage = `url(${cartaDado.img})`;
            
            cartaElemento.addEventListener('click', () => {
                alert("Você clicou na carta aliada: " + cartaDado.nome + " com força " + cartaDado.forca);
            });

            maoAliado.appendChild(cartaElemento);
        });

        // Renderizar cartas inimigas (borda vermelha e classe inimigo)
        bancoDeCartasInimigas.forEach(cartaDado => {
            let cartaElemento = document.createElement('div');
            cartaElemento.classList.add('carta', 'inimigo');
            cartaElemento.style.backgroundImage = `url(${cartaDado.img})`;
            
            cartaElemento.addEventListener('click', () => {
                alert("Você olhou para a carta inimiga: " + cartaDado.nome + " com força " + cartaDado.forca);
            });

            maoInimigo.appendChild(cartaElemento);
        });
    </script>
</body>
</html>
